[project]
name = "replaytv-stremio"
version = "1.1.0"
description = "Catch-up TV & More for Stremio — French and Canadian live TV and replays"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["app/static"]

[tool.ruff.lint]
# F: pyflakes (unused imports/variables, undefined names — would have caught
#    the `traceback`-without-import bug in cbc.py)
# E4/E7/E9: pycodestyle errors (imports, statements, runtime-breaking syntax)
# B: bugbear (mutable default args, useless expressions)
select = ["F", "E4", "E7", "E9", "B"]
ignore = [
    "E722",  # bare except — used deliberately in defensive parsing paths
    "B008",  # function call in default arg — FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions for isolation on purpose
"tests/**" = ["F401"]
"app/tests/**" = ["F401"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that make real network calls (deselect with -m \"not integration\")",
]
